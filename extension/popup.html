<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon-48.png" alt="" width="24" height="24">
    <h1>HerbiSight</h1>
  </header>

  <section class="platform-group">
    <div class="row">
      <span class="label">YouTube</span>
      <div class="seg" id="yt-mode">
        <button data-val="allow" id="yt-allow">Allow</button>
        <button data-val="dim" id="yt-dim">Dim</button>
        <button data-val="block" id="yt-block">Block</button>
      </div>
    </div>
    <div class="row subrow" id="shorts-row">
      <span class="label sub">Auto-skip Shorts</span>
      <label class="switch small" title="Automatically skip AI-labeled Shorts">
        <input type="checkbox" id="skipShorts">
        <span class="slider"></span>
      </label>
    </div>
  </section>

  <section class="platform-group">
    <div class="row">
      <span class="label">Facebook</span>
      <div class="seg" id="fb-mode">
        <button data-val="allow" id="fb-allow">Allow</button>
        <button data-val="dim" id="fb-dim">Dim</button>
        <button data-val="block" id="fb-block">Block</button>
      </div>
    </div>
  </section>

  <section class="stats">
    <div><b id="stat-session">–</b><span>weeds pulled<br>on this page</span></div>
    <div><b id="stat-total">–</b><span>pulled<br>all-time</span></div>
    <div><b id="stat-checked">–</b><span>entries<br>checked</span></div>
  </section>

  <footer>
    <span class="hint">Filters platform AI disclosure labels</span>
    <button id="clear" title="Reset stats and cached verdicts">Reset data</button>
  </footer>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
